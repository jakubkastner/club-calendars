name: Update Bike Jesus Calendar

on:
  schedule:
    # Triggers automatically every day at 4:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Enables manual trigger button inside the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository source code
      uses: actions/checkout@v3

    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests ics

    - name: Execute API ingestion script
      # Changing directory to bike-jesus and running the updated script name
      run: |
        cd scripts
        python bike-jesus.py

    - name: Commit and push updated files (Calendar + Archive)
      # Working paths adjusted to target your specific folder structure
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add bike-jesus-calendar.ics bike-jesus-archive.json
        git checkout -b data || git checkout data
        git commit -m "Automated database & calendar update [skip ci]" || exit 0
        git push